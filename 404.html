<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found | Heavy Soul</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS Reset & Global Styles */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Helvetica Neue', Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #ffffff; color: #000000; display: flex; flex-direction: column; min-height: 100vh; justify-content: space-between; }
        
        /* Top Navigation */
        .top-nav { display: flex; justify-content: center; align-items: center; padding: 20px; position: relative; border-bottom: 1px solid #eeeeee; }
        .top-nav .back-btn { position: absolute; left: 20px; font-size: 1.2rem; cursor: pointer; color: #000; }
        .top-nav .logo { font-weight: 900; font-size: 1.4rem; letter-spacing: 1px; text-transform: uppercase; text-decoration: none; color: #000; }

        /* Error Container */
        .error-container { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; }
        .error-code { font-size: 5rem; font-weight: 900; line-height: 1; margin-bottom: 15px; letter-spacing: 2px; }
        .error-title { font-size: 1.2rem; font-weight: 900; text-transform: uppercase; margin-bottom: 10px; }
        .error-desc { font-size: 0.85rem; color: #666666; font-weight: 600; max-width: 350px; line-height: 1.5; margin-bottom: 30px; }

        /* Action Button */
        .btn-home { display: inline-block; width: 100%; max-width: 250px; padding: 15px; background-color: #000000; color: #ffffff; font-weight: 900; font-size: 0.9rem; text-transform: uppercase; border: none; border-radius: 3px; cursor: pointer; text-decoration: none; letter-spacing: 0.5px; transition: transform 0.15s ease, opacity 0.2s ease; }
        .btn-home:active { transform: scale(0.96); opacity: 0.85; }

        /* Footer */
        .error-footer { text-align: center; padding: 20px; font-size: 0.75rem; color: #999999; font-weight: 600; text-transform: uppercase; border-top: 1px solid #eeeeee; }
    </style>
</head>
<body>

    <!-- Top Navigation -->
    <nav class="top-nav">
        <i class="fa-solid fa-arrow-left back-btn" onclick="window.history.back()"></i>
        <a href="index.html" class="logo">HEAVY SOUL</a>
    </nav>

    <!-- Error Content -->
    <div class="error-container">
        <div class="error-code">404</div>
        <div class="error-title">Page Not Found / No Internet</div>
        <div class="error-desc">The page you are looking for might have been removed, had its name changed, or you are currently offline.</div>
        <a href="index.html" class="btn-home">Back to Home</a>
    </div>

    <!-- Footer -->
    <div class="error-footer">
        Oversized. Bold. Fearless.
    </div>

</body>
</html>
