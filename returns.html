<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Return & Exchange | Heavy Soul</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Helvetica Neue', Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #ffffff; color: #000000; padding-bottom: 50px; }
        .top-nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 1px solid #eeeeee; position: sticky; top: 0; background: #ffffff; z-index: 100; }
        .top-nav i { font-size: 1.2rem; cursor: pointer; color: #000; }
        .top-nav .logo { font-weight: 900; font-size: 1.3rem; letter-spacing: 1px; text-transform: uppercase; }
        .content-container { padding: 30px 20px; max-width: 800px; margin: 0 auto; }
        h1 { font-size: 1.3rem; font-weight: 900; text-transform: uppercase; margin-bottom: 25px; letter-spacing: 0.5px; border-bottom: 2px solid #000000; padding-bottom: 10px; }
        p { font-size: 0.9rem; line-height: 1.6; color: #555555; margin-bottom: 15px; font-weight: 500; }
    </style>
</head>
<body>
    <nav class="top-nav">
        <i class="fa-solid fa-arrow-left" onclick="window.history.back()"></i>
        <div class="logo">HEAVY SOUL</div>
        <i class="fa-solid fa-cart-shopping" onclick="window.location.href='cart.html'"></i>
    </nav>
    <div class="content-container">
        <h1>Return & Exchange Policy</h1>
        <p>We offer <strong>Easy Returns in 7 Days</strong>.</p>
        <p>If you face any sizing issues (such as M size chest 42 inch and length 28 inch mismatch) or receive a defective product, you can request a hassle-free exchange or return directly through our support or WhatsApp.</p>
    </div>
</body>
</html>
