<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed | Heavy Soul</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS Reset & Global Styles */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Helvetica Neue', Arial, sans-serif; }
        body { background-color: #ffffff; color: #000000; padding-bottom: 30px; }
        
        /* 1. Top Navigation */
        .top-nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 1px solid #eeeeee; background: #ffffff; }
        .top-nav .menu-icon { font-size: 1.2rem; cursor: pointer; color: #000; }
        .top-nav .logo { font-weight: 900; font-size: 1.3rem; letter-spacing: 1px; text-transform: uppercase; }
        .top-nav .nav-icons { display: flex; gap: 15px; visibility: hidden; } /* To center the logo */

        /* 2. Success Message Section */
        .success-section { text-align: center; padding: 30px 20px 20px; }
        .success-icon { width: 70px; height: 70px; background-color: #4CAF50; color: #ffffff; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 2rem; margin: 0 auto 15px; box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3); }
        .success-section h1 { font-size: 1.4rem; font-weight: 900; margin-bottom: 5px; }
        .success-section h2 { font-size: 0.9rem; font-weight: 700; color: #333333; margin-bottom: 15px; }
        .order-id { font-size: 1.1rem; font-weight: 900; margin-bottom: 10px; }
        .success-message { font-size: 0.85rem; color: #555555; line-height: 1.5; margin-bottom: 25px; padding: 0 10px; font-weight: 500; }

        /* 3. Order Summary Box */
        .order-summary-container { padding: 0 20px; }
        .section-title { font-size: 0.8rem; font-weight: 800; text-transform: uppercase; margin-bottom: 12px; color: #333; }
        .summary-box { border: 1px solid #eeeeee; border-radius: 4px; padding: 15px; background: #fafafa; }
        
        .item-row { display: flex; gap: 15px; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #eeeeee; }
        .item-image { width: 60px; height: 75px; background-color: #000; border-radius: 3px; overflow: hidden; flex-shrink: 0; }
        .item-image img { width: 100%; height: 100%; object-fit: cover; }
        .item-details { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }
        .item-title { font-size: 0.9rem; font-weight: 800; }
        .item-variant { font-size: 0.8rem; color: #666; margin-top: 3px; }
        .item-qty { font-size: 0.8rem; color: #666; margin-top: 3px; }
        .item-price { font-size: 0.95rem; font-weight: 800; text-align: right; margin-top: 10px; }
        
        .price-row { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 10px; font-weight: 600; color: #555; }
        .price-row.total { font-size: 1.1rem; font-weight: 900; color: #000; border-top: 1px solid #eeeeee; padding-top: 12px; margin-top: 5px; margin-bottom: 0; }

        /* 4. Footer Message & Button */
        .notification-msg { text-align: center; font-size: 0.8rem; color: #555555; font-weight: 600; padding: 25px 30px; line-height: 1.4; }
        .btn-continue { width: calc(100% - 40px); margin: 0 20px; padding: 15px; background-color: #ffffff; color: #000000; font-weight: 900; font-size: 0.9rem; text-transform: uppercase; border: 2px solid #000000; border-radius: 3px; cursor: pointer; letter-spacing: 0.5px; display: block; text-align: center; text-decoration: none; transition: 0.2s; }
        .btn-continue:hover { background-color: #000000; color: #ffffff; }

    </style>
</head>
<body>

    <!-- Top Navigation -->
    <nav class="top-nav">
        <i class="fa-solid fa-bars menu-icon"></i>
        <div class="logo">HEAVY SOUL</div>
        <div class="nav-icons">
            <i class="fa-solid fa-cart-shopping"></i>
        </div>
    </nav>

    <!-- Success Message Section -->
    <section class="success-section">
        <div class="success-icon">
            <i class="fa-solid fa-check"></i>
        </div>
        <h1>THANK YOU!</h1>
        <h2>YOUR ORDER IS CONFIRMED</h2>
        <div class="order-id">Order ID: HS123456</div>
        <p class="success-message">We have received your order and it is now being processed.</p>
    </section>

    <!-- Order Summary -->
    <div class="order-summary-container">
        <div class="section-title">ORDER SUMMARY</div>
        <div class="summary-box">
            <!-- Item -->
            <div class="item-row">
                <div class="item-image">
                    <img src="https://via.placeholder.com/120x150/000000/FFFFFF?text=Dark+Reflection" alt="Dark Reflection T-Shirt">
                </div>
                <div class="item-details">
                    <div class="item-title">Dark Reflection</div>
                    <div class="item-variant">Black / M</div>
                    <div class="item-qty">Qty: 1</div>
                </div>
                <div class="item-price">₹799</div>
            </div>
            
            <!-- Price Breakdown -->
            <div class="price-row">
                <span>Subtotal</span>
                <span>₹799</span>
            </div>
            <div class="price-row">
                <span>Shipping</span>
                <span>₹0</span>
            </div>
            <div class="price-row total">
                <span>Total</span>
                <span>₹799</span>
            </div>
        </div>
    </div>

    <!-- Notification Message -->
    <div class="notification-msg">
        You will receive an email & WhatsApp confirmation shortly.
    </div>

    <!-- Continue Shopping Button -->
    <a href="shop.html" class="btn-continue">CONTINUE SHOPPING</a>

<script src="js/config.js"></script><script src="https://checkout.razorpay.com/v1/checkout.js"></script><script src="js/commerce.js"></script></body>
</html>
