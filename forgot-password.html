<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Heavy Soul</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS Reset & Global Settings */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Helvetica Neue', Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #ffffff; color: #000000; display: flex; flex-direction: column; min-height: 100vh; }
        
        /* 1. Top Navigation */
        .top-nav { display: flex; justify-content: center; align-items: center; padding: 20px; position: relative; border-bottom: 1px solid #eeeeee; }
        .top-nav .back-btn { position: absolute; left: 20px; font-size: 1.2rem; cursor: pointer; color: #000; }
        .top-nav .logo { font-weight: 900; font-size: 1.4rem; letter-spacing: 1px; text-transform: uppercase; }

        /* 2. Container */
        .forgot-container { flex-grow: 1; padding: 40px 20px; max-width: 500px; margin: 0 auto; width: 100%; }
        
        .page-title { font-size: 1.3rem; font-weight: 900; text-transform: uppercase; margin-bottom: 10px; }
        .page-desc { font-size: 0.85rem; color: #666666; font-weight: 600; line-height: 1.5; margin-bottom: 30px; }

        /* 3. Form Styles */
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 0.8rem; font-weight: 800; text-transform: uppercase; margin-bottom: 8px; color: #333333; }
        .input-group input { width: 100%; padding: 15px; border: 1px solid #cccccc; border-radius: 3px; font-size: 0.95rem; font-weight: 600; outline: none; transition: border 0.2s; }
        .input-group input:focus { border-color: #000000; }

        /* 4. Action Button */
        .btn-submit { width: 100%; padding: 16px; background-color: #000000; color: #ffffff; font-weight: 900; font-size: 0.95rem; text-transform: uppercase; border: none; border-radius: 3px; cursor: pointer; letter-spacing: 0.5px; margin-bottom: 20px; transition: 0.15s; }
        .btn-submit:active { transform: scale(0.96); opacity: 0.85; }

        /* 5. Back to Login link */
        .back-to-login { text-align: center; margin-top: 15px; }
        .back-to-login a { color: #000000; font-size: 0.85rem; font-weight: 700; text-decoration: underline; text-transform: uppercase; }

        /* 6. Loading Overlay (shown while the reset link "sends") */
        body.is-sending .forgot-container { opacity: 0.35; pointer-events: none; transition: opacity 0.2s ease; }
        .btn-submit:disabled { cursor: default; opacity: 0.7; }
        .btn-submit .btn-spinner {
            display: none; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.35);
            border-top-color: #ffffff; border-radius: 50%; margin: 0 auto;
            animation: hs-spin 0.7s linear infinite;
        }
        .btn-submit:disabled .btn-spinner { display: inline-block; }
        .btn-submit:disabled .btn-label { display: none; }

        .send-loading-overlay {
            position: fixed; inset: 0; background: rgba(255,255,255,0.55);
            display: none; align-items: center; justify-content: center; z-index: 1000;
        }
        body.is-sending .send-loading-overlay { display: flex; }
        .send-loading-overlay .spinner {
            width: 34px; height: 34px; border: 3px solid rgba(0,0,0,0.15);
            border-top-color: #000000; border-radius: 50%;
            animation: hs-spin 0.7s linear infinite;
        }
        @keyframes hs-spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Top Navigation -->
    <nav class="top-nav">
        <i class="fa-solid fa-arrow-left back-btn" onclick="window.history.back()"></i>
        <div class="logo">HEAVY SOUL</div>
    </nav>

    <!-- Forgot Password Container -->
    <div class="forgot-container">
        <div class="page-title">Reset Password</div>
        <div class="page-desc">Enter your email address or phone number associated with your account, and we'll send you a secure link to reset your password.</div>

        <form onsubmit="event.preventDefault(); sendResetLink(this);">
            <div class="input-group">
                <label>Email or Phone Number</label>
                <input type="text" placeholder="Enter your email or phone" required>
            </div>
            <button type="submit" class="btn-submit">
                <span class="btn-label">SEND RESET LINK</span>
                <span class="btn-spinner"></span>
            </button>
        </form>

        <div class="back-to-login">
            <a href="login.html">Back to Login</a>
        </div>
    </div>

    <!-- Full-page dim + spinner overlay, shown while the reset link "sends" -->
    <div class="send-loading-overlay" id="sendLoadingOverlay">
        <div class="spinner"></div>
    </div>

    <script>
        function sendResetLink(formEl) {
            const btn = formEl.querySelector('.btn-submit');
            if (btn.disabled) return; // guard against double-tap while already processing
            btn.disabled = true;
            document.body.classList.add('is-sending');
            setTimeout(() => { window.location.href = 'login.html'; }, 700);
        }
    </script>

</body>
</html>
