<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<meta name="description" content="Secure checkout for your Heavy Soul order — Prepaid or COD, shipped across India.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Heavy Soul">
<meta property="og:title" content="Checkout — Heavy Soul">
<meta property="og:description" content="Secure checkout for your Heavy Soul order — Prepaid or COD, shipped across India.">
<meta property="og:image" content="https://heavysoul.in/assets/og-image.jpg">
<meta property="og:url" content="https://heavysoul.in/checkout.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Checkout — Heavy Soul">
<meta name="twitter:description" content="Secure checkout for your Heavy Soul order — Prepaid or COD, shipped across India.">
<meta name="twitter:image" content="https://heavysoul.in/assets/og-image.jpg">
<title>Checkout — Heavy Soul</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <nav class="nav wrap">
    <a href="index.html" class="brand">Heavy Soul<small>Est. 2026</small></a>
    <div></div>
    <div class="nav-icons">
      <a class="icon-btn" id="accountBtn" href="account.html" aria-label="Login / Signup">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1.7-3.6 5-5.5 7.5-5.5s5.8 1.9 7.5 5.5"/></svg>
      </a>
      <a class="icon-btn" href="cart.html" aria-label="Cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 8h12l-1 12H7L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        <span class="cart-count" id="cartCount">0</span>
      </a>
    </div>
  </nav>
</header>

<div class="wrap">
  <div class="steps">
    <div class="step done"><span class="dot">✓</span> Bag</div>
    <div class="step active"><span class="dot">2</span> Shipping</div>
    <div class="step"><span class="dot">3</span> Payment</div>
  </div>

  <div class="checkout-layout">
    <div>
      <h1 style="font-size:28px; margin-bottom:6px;">Shipping details</h1>
      <p class="hint" style="margin-bottom:22px;">Fill this in once — we'll remember it for next time.</p>
      <div class="form-grid">
        <div class="field">
          <label for="name">Full name</label>
          <input id="name" name="name" type="text" autocomplete="name" placeholder="Your full name">
          <span class="field-err" id="err-name">Please enter your name</span>
        </div>
        <div class="field">
          <label for="phone">Phone number</label>
          <input id="phone" name="tel" type="tel" autocomplete="tel" placeholder="10-digit mobile number" inputmode="numeric">
          <span class="field-err" id="err-phone">Enter a valid 10-digit mobile number</span>
        </div>
        <div class="field full">
          <label for="email">Email (optional)</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@email.com">
        </div>
        <div class="field full">
          <label for="address">Full address</label>
          <textarea id="address" name="street-address" autocomplete="street-address" rows="3" placeholder="House / street / landmark"></textarea>
          <span class="field-err" id="err-address">Please enter your full address</span>
        </div>
        <div class="field">
          <label for="pin">PIN code</label>
          <input id="pin" name="postal-code" type="text" autocomplete="postal-code" placeholder="6-digit PIN" inputmode="numeric">
          <span class="field-err" id="err-pin">Enter a valid 6-digit PIN code</span>
          <span class="hint" id="pinChecking"></span>
        </div>
        <div class="field">
          <label for="city">City / District</label>
          <input id="city" name="address-level2" type="text" autocomplete="address-level2" placeholder="Auto-filled from PIN code">
        </div>
        <div class="field full">
          <label for="state">State</label>
          <input id="state" name="address-level1" type="text" autocomplete="address-level1" placeholder="Auto-filled from PIN code">
        </div>
      </div>
    </div>

    <div class="summary-card">
      <h3>Your bag</h3>
      <div id="checkoutItems"></div>
      <div class="sum-row total"><span>Total</span><span id="checkoutTotal">₹0</span></div>
    </div>
  </div>
</div>

<div class="pay-bar-spacer"></div>
<div class="pay-bar">
  <div class="pay-bar-inner">
    <div class="pay-bar-amount">
      <span class="label">Total</span>
      <span class="value" id="barTotal">₹0</span>
    </div>
    <button class="btn accent" onclick="goToPayment()">Continue to payment</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/config.js"></script>
<script src="js/analytics.js"></script>
<script src="js/auth.js"></script>
<script src="js/orders.js"></script>
<script src="js/toast.js"></script>
<script src="js/nav.js"></script>
<script src="js/checkout.js"></script>
<script>
  // Guard: if someone opens checkout.html directly without logging in
  // (skipping the cart page), send them back to the cart to log in first.
  document.addEventListener("DOMContentLoaded", function () {
    if (!authReady()) return;
    firebase.auth().onAuthStateChanged(function (user) {
      if (!user) window.location.href = "cart.html";
    });
  });
</script>
</body>
</html>
