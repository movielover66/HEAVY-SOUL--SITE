<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Reviews | Heavy Soul</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS Reset & Global Styles */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Helvetica Neue', Arial, sans-serif; }
        body { background-color: #ffffff; color: #000000; padding-bottom: 40px; }
        
        /* 1. Top Navigation */
        .top-nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 1px solid #eeeeee; position: sticky; top: 0; background: #ffffff; z-index: 100; }
        .top-nav i { font-size: 1.2rem; cursor: pointer; color: #000; }
        .top-nav .logo { font-weight: 900; font-size: 1.3rem; letter-spacing: 1px; text-transform: uppercase; }

        /* 2. Page Title & Overall Rating */
        .page-header { text-align: center; padding: 25px 20px 20px; border-bottom: 1px solid #eeeeee; }
        .page-header h1 { font-size: 1.1rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 15px; }
        
        .overall-rating { display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 10px; }
        .rating-number { font-size: 3.5rem; font-weight: 900; line-height: 1; }
        .rating-stars { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; }
        .rating-stars .stars i { color: #FFD700; font-size: 1.2rem; }
        .review-count { font-size: 0.85rem; color: #555555; font-weight: 700; }
        
        .trust-text { font-size: 0.8rem; color: #666666; font-weight: 600; margin-top: 10px; }

        /* 3. Review List */
        .reviews-container { padding: 0 20px; }
        .review-card { padding: 20px 0; border-bottom: 1px solid #eeeeee; }
        
        /* Reviewer Header */
        .reviewer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .reviewer-info { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 35px; height: 35px; border-radius: 50%; background-color: #dddddd; overflow: hidden; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .reviewer-name { font-weight: 800; font-size: 0.95rem; }
        .review-stars i { color: #FFD700; font-size: 0.75rem; }
        
        /* Review Body */
        .review-body { display: flex; gap: 15px; justify-content: space-between; }
        .review-text { font-size: 0.85rem; color: #444444; line-height: 1.5; font-weight: 500; flex-grow: 1; }
        .product-thumb { width: 50px; height: 60px; background-color: #000; border-radius: 3px; flex-shrink: 0; overflow: hidden; }
        .product-thumb img { width: 100%; height: 100%; object-fit: cover; }

        /* 4. View All Button */
        .btn-view-all { width: calc(100% - 40px); margin: 30px auto 0; padding: 15px; background-color: #ffffff; color: #000000; font-weight: 900; font-size: 0.85rem; text-transform: uppercase; border: 2px solid #000000; border-radius: 3px; cursor: pointer; letter-spacing: 0.5px; display: block; text-align: center; text-decoration: none; transition: 0.2s; }
        .btn-view-all:hover { background-color: #000000; color: #ffffff; }

    </style>
</head>
<body>

    <!-- Top Navigation -->
    <nav class="top-nav">
        <i class="fa-solid fa-bars"></i>
        <div class="logo">HEAVY SOUL</div>
        <i class="fa-solid fa-magnifying-glass"></i>
    </nav>

    <!-- Overall Rating Section — no fabricated rating/count until real reviews exist -->
    <div class="page-header">
        <h1>Customer Reviews</h1>
        <div class="trust-text" style="margin-top: 10px;">We're a new brand — every review here will be from a real customer, never made up.</div>
    </div>

    <!-- Reviews List: empty until real customer reviews come in -->
    <div class="reviews-container" style="text-align: center; padding: 40px 20px;">
        <i class="fa-regular fa-comment-dots" style="font-size: 2.2rem; color: #ddd; margin-bottom: 14px;"></i>
        <h2 style="font-size: 1rem; font-weight: 800; margin-bottom: 8px;">No reviews yet</h2>
        <p style="font-size: 0.82rem; color: #888; line-height: 1.5;">Be one of our first customers to leave a review after your order arrives!</p>
    </div>

    <a href="shop.html" class="btn-view-all">SHOP NOW</a>

</body>
</html>
