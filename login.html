<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign Up | Heavy Soul</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS Reset & Global Styles */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Helvetica Neue', Arial, sans-serif; }
        body { background-color: #ffffff; color: #000000; display: flex; flex-direction: column; min-height: 100vh; }
        
        /* 1. Top Navigation */
        .top-nav { display: flex; justify-content: center; align-items: center; padding: 20px; position: relative; border-bottom: 1px solid #eeeeee; }
        .top-nav .back-btn { position: absolute; left: 20px; font-size: 1.2rem; cursor: pointer; color: #000; }
        .top-nav .logo { font-weight: 900; font-size: 1.4rem; letter-spacing: 1px; text-transform: uppercase; }

        /* 2. Auth Container */
        .auth-container { flex-grow: 1; padding: 30px 20px; max-width: 500px; margin: 0 auto; width: 100%; }
        
        /* 3. Toggle Tabs */
        .auth-tabs { display: flex; border-bottom: 2px solid #eeeeee; margin-bottom: 30px; }
        .tab-btn { flex: 1; text-align: center; padding: 15px 0; font-weight: 900; font-size: 1rem; text-transform: uppercase; color: #999999; cursor: pointer; transition: 0.3s; position: relative; }
        .tab-btn.active { color: #000000; }
        .tab-btn.active::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 100%; height: 2px; background-color: #000000; }

        /* 4. Form Styles */
        .auth-form { display: none; animation: fadeIn 0.3s ease; }
        .auth-form.active { display: block; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 0.8rem; font-weight: 800; text-transform: uppercase; margin-bottom: 8px; color: #333333; }
        .input-group input { width: 100%; padding: 15px; border: 1px solid #cccccc; border-radius: 3px; font-size: 0.95rem; font-weight: 600; outline: none; transition: border 0.2s; }
        .input-group input:focus { border-color: #000000; }
        
        .forgot-password { text-align: right; margin-top: -10px; margin-bottom: 20px; }
        .forgot-password a { color: #666666; font-size: 0.8rem; font-weight: 600; text-decoration: underline; }

        /* 5. Action Buttons */
        .btn-submit { width: 100%; padding: 16px; background-color: #000000; color: #ffffff; font-weight: 900; font-size: 0.95rem; text-transform: uppercase; border: none; border-radius: 3px; cursor: pointer; letter-spacing: 0.5px; margin-bottom: 20px; }
        
        /* 6. Social Login Divider */
        .divider { display: flex; align-items: center; text-align: center; margin: 25px 0; color: #999999; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #eeeeee; }
        .divider:not(:empty)::before { margin-right: 15px; }
        .divider:not(:empty)::after { margin-left: 15px; }

        .btn-google { width: 100%; padding: 15px; background-color: #ffffff; color: #000000; font-weight: 800; font-size: 0.9rem; text-transform: uppercase; border: 1px solid #dddddd; border-radius: 3px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; transition: 0.2s; }
        .btn-google:hover { background-color: #f9f9f9; }
        .btn-google img { width: 18px; height: 18px; }

    </style>
</head>
<body>

    <!-- Top Navigation -->
    <nav class="top-nav">
        <i class="fa-solid fa-arrow-left back-btn" onclick="window.history.back()"></i>
        <div class="logo">HEAVY SOUL</div>
    </nav>

    <!-- Auth Container -->
    <div class="auth-container">
        
        <!-- Toggle Tabs -->
        <div class="auth-tabs">
            <div class="tab-btn active" id="tabLogin" onclick="switchTab('login')">Login</div>
            <div class="tab-btn" id="tabSignup" onclick="switchTab('signup')">Sign Up</div>
        </div>

        <!-- Login Form -->
        <form class="auth-form active" id="formLogin">
            <div class="input-group">
                <label>Email or Phone Number</label>
                <input type="text" placeholder="Enter your email or phone" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" placeholder="Enter your password" required>
            </div>
            <div class="forgot-password">
                <a href="#">Forgot Password?</a>
            </div>
            <button type="submit" class="btn-submit">LOGIN</button>
        </form>

        <!-- Sign Up Form -->
        <form class="auth-form" id="formSignup">
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" placeholder="Enter your full name" required>
            </div>
            <div class="input-group">
                <label>Email or Phone Number</label>
                <input type="text" placeholder="Enter your email or phone" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" placeholder="Create a password" required>
            </div>
            <button type="submit" class="btn-submit">CREATE ACCOUNT</button>
        </form>

        <!-- Social Login -->
        <div class="divider">OR</div>
        
        <button class="btn-google" type="button" id="googleLoginBtn">
            <!-- Using a standard Google icon URL for demo -->
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google Logo">
            Continue with Google
        </button>

    </div>

    <!-- JavaScript to toggle tabs -->
    <script>
        function switchTab(tab) {
            // Get elements
            const tabLogin = document.getElementById('tabLogin');
            const tabSignup = document.getElementById('tabSignup');
            const formLogin = document.getElementById('formLogin');
            const formSignup = document.getElementById('formSignup');

            // Reset all
            tabLogin.classList.remove('active');
            tabSignup.classList.remove('active');
            formLogin.classList.remove('active');
            formSignup.classList.remove('active');

            // Activate selected
            if (tab === 'login') {
                tabLogin.classList.add('active');
                formLogin.classList.add('active');
            } else {
                tabSignup.classList.add('active');
                formSignup.classList.add('active');
            }
        }
    </script>

<script src="js/config.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="js/auth.js"></script><script src="js/orders.js"></script><script src="js/msg91-otp.js"></script><script src="js/auth-unified.js"></script><script>
document.addEventListener('DOMContentLoaded',()=>{
 const lf=document.getElementById('formLogin'), sf=document.getElementById('formSignup');
 lf?.addEventListener('submit',async e=>{e.preventDefault(); const v=lf.querySelectorAll('input'); const id=v[0].value.trim(); const pw=v[1].value; if(id.includes('@')){try{await authLogIn(id,pw);location.href='account.html'}catch(err){alert(authErrorMessage(err))}}else alert('Mobile login-এর জন্য account modal/OTP flow ব্যবহার করুন।');});
 sf?.addEventListener('submit',async e=>{e.preventDefault(); const v=sf.querySelectorAll('input'); const name=v[0].value.trim(), id=v[1].value.trim(), pw=v[2].value; if(!id.includes('@')){alert('Mobile signup-এর জন্য OTP verification flow ব্যবহার করুন।');return;} try{await authSignUp(name,id,pw);location.href='account.html'}catch(err){alert(authErrorMessage(err))}});
 document.getElementById('googleLoginBtn')?.addEventListener('click',async()=>{try{await authGoogleSignIn();location.href='account.html'}catch(err){alert(authErrorMessage(err))}});
});
</script></body>
</html>
