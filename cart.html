<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart | Heavy Soul</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS Reset & Global Styles */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Helvetica Neue', Arial, sans-serif; }
        body { background-color: #ffffff; color: #000000; padding-bottom: 90px; }
        
        /* 1. Top Navigation */
        .top-nav { display: flex; align-items: center; padding: 15px 20px; border-bottom: 1px solid #eeeeee; position: sticky; top: 0; background: #ffffff; z-index: 100; gap: 15px; }
        .top-nav i { font-size: 1.2rem; cursor: pointer; color: #000; }
        .top-nav h1 { font-weight: 900; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 0.5px; margin: 0; }

        /* 2. Cart Item */
        .cart-container { padding: 20px; }
        .cart-item { display: flex; gap: 15px; margin-bottom: 25px; position: relative; border-bottom: 1px solid #f0f0f0; padding-bottom: 20px; }
        .cart-item-image { width: 85px; height: 105px; background-color: #000; border-radius: 4px; overflow: hidden; flex-shrink: 0; }
        .cart-item-image img { width: 100%; height: 100%; object-fit: cover; }
        
        .cart-item-details { flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .item-title { font-size: 0.95rem; font-weight: 800; }
        .item-variant { font-size: 0.8rem; color: #666; margin-top: 3px; }
        .item-price { font-size: 0.95rem; font-weight: 700; margin-top: 5px; }
        
        /* Quantity & Delete */
        .item-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .qty-selector { display: flex; align-items: center; border: 1px solid #dddddd; border-radius: 3px; width: fit-content; }
        .qty-btn { padding: 5px 12px; cursor: pointer; font-weight: 800; background: #ffffff; border: none; font-size: 1rem; }
        .qty-val { padding: 5px 12px; font-weight: 700; font-size: 0.9rem; border-left: 1px solid #dddddd; border-right: 1px solid #dddddd; }
        .delete-btn { color: #555555; cursor: pointer; font-size: 1.1rem; padding: 5px; background: none; border: none; }

        /* 3. Price Details */
        .price-details { border-top: 1px solid #eeeeee; padding-top: 20px; margin-bottom: 20px; }
        .price-row { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 12px; font-weight: 600; color: #555; }
        .price-row.total { font-size: 1.1rem; font-weight: 900; color: #000; border-top: 1px solid #eeeeee; padding-top: 12px; margin-top: 5px; }

        /* 4. Free Shipping Banner */
        .free-shipping-banner { background-color: #f8f8f8; border: 1px dashed #cccccc; padding: 15px; text-align: center; border-radius: 4px; margin-bottom: 25px; font-size: 0.85rem; font-weight: 700; }
        .free-shipping-banner span { color: #d97706; }

        /* 5. Action Buttons */
        .btn { width: 100%; padding: 16px; font-weight: 900; font-size: 0.9rem; text-transform: uppercase; cursor: pointer; border-radius: 3px; text-align: center; letter-spacing: 0.5px; display: block; text-decoration: none; }
        .btn-checkout { background-color: #000000; color: #ffffff; border: 2px solid #000000; margin-bottom: 15px; }
        .btn-continue { background-color: #ffffff; color: #555555; border: none; font-size: 0.8rem; text-align: center; }
        
        .empty-cart { text-align: center; padding: 40px 20px; color: #666; font-weight: 600; font-size: 0.95rem; }

        /* 6. Bottom Navigation (Sticky) */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #ffffff; border-top: 1px solid #eeeeee; display: flex; justify-content: space-around; padding: 12px 0; z-index: 1000; }
        .nav-item { text-align: center; color: #999999; text-decoration: none; font-size: 0.65rem; display: flex; flex-direction: column; align-items: center; gap: 5px; font-weight: 600; }
        .nav-item.active { color: #000000; }
        .nav-item i { font-size: 1.2rem; }
    </style>
</head>
<body>

    <!-- Top Navigation -->
    <nav class="top-nav">
        <i class="fa-solid fa-arrow-left" onclick="window.location.href='index.html'"></i>
        <h1 id="cartHeading">Your Cart (0)</h1>
    </nav>

    <div class="cart-container" id="cartMainContainer">
        <!-- Dynamic Cart Items Container -->
        <div id="cartItemsList"></div>

        <!-- Price Details -->
        <div class="price-details" id="priceDetailsSection" style="display: none;">
            <div class="price-row">
                <span>Subtotal</span>
                <span>₹<span id="subtotalDisplay">0</span></span>
            </div>
            <div class="price-row">
                <span>Shipping</span>
                <span>₹<span id="shippingDisplay">0</span></span>
            </div>
            <div class="price-row total">
                <span>Total</span>
                <span>₹<span id="totalDisplay">0</span></span>
            </div>
        </div>

        <!-- Free Shipping Banner -->
        <div class="free-shipping-banner" id="shippingBanner" style="display: none;">
            <!-- Will be updated dynamically -->
        </div>

        <!-- Actions -->
        <div id="cartActions" style="display: none;">
            <a href="checkout.html" class="btn btn-checkout">PROCEED TO CHECKOUT</a>
        </div>
        <a href="shop.html" class="btn btn-continue"><i class="fa-solid fa-chevron-left"></i> CONTINUE SHOPPING</a>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="shop.html" class="nav-item">
            <i class="fa-solid fa-bag-shopping"></i>
            <span>Shop</span>
        </a>
        <a href="wishlist.html" class="nav-item">
            <i class="fa-regular fa-heart"></i>
            <span>Wishlist</span>
        </a>
        <a href="account.html" class="nav-item">
            <i class="fa-regular fa-user"></i>
            <span>Account</span>
        </a>
        <a href="cart.html" class="nav-item active">
            <i class="fa-solid fa-cart-shopping"></i>
            <span>Cart</span>
        </a>
    </nav>

    <!-- JavaScript for Dynamic Cart Logic -->
    <script>
        const freeShippingThreshold = 1000;

        function loadCart() {
            let cart = JSON.parse(localStorage.getItem('heavySoulCart')) || [];
            let listContainer = document.getElementById('cartItemsList');
            let priceDetails = document.getElementById('priceDetailsSection');
            let shippingBanner = document.getElementById('shippingBanner');
            let cartActions = document.getElementById('cartActions');
            let cartHeading = document.getElementById('cartHeading');

            // Update top header count
            let totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            cartHeading.innerText = `Your Cart (${totalCount})`;

            if (cart.length === 0) {
                listContainer.innerHTML = `<div class="empty-cart">Your cart is empty!<br><br></div>`;
                priceDetails.style.display = 'none';
                shippingBanner.style.display = 'none';
                cartActions.style.display = 'none';
                return;
            }

            priceDetails.style.display = 'block';
            shippingBanner.style.display = 'block';
            cartActions.style.display = 'block';

            let html = '';
            let subtotal = 0;

            cart.forEach((item, index) => {
                let itemTotal = item.price * item.quantity;
                subtotal += itemTotal;

                html += `
                    <div class="cart-item">
                        <div class="cart-item-image">
                            <img src="${item.image}" alt="${item.name}">
                        </div>
                        <div class="cart-item-details">
                            <div>
                                <div class="item-title">${item.name}</div>
                                <div class="item-variant">Size: ${item.size}</div>
                                <div class="item-price">₹${item.price}</div>
                            </div>
                            <div class="item-actions">
                                <div class="qty-selector">
                                    <button class="qty-btn" onclick="changeQty(${index}, -1)">-</button>
                                    <div class="qty-val">${item.quantity}</div>
                                    <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
                                </div>
                                <button class="delete-btn" onclick="removeItem(${index})"><i class="fa-regular fa-trash-can"></i></button>
                            </div>
                        </div>
                    </div>
                `;
            });

            listContainer.innerHTML = html;

            // Update Subtotal & Total
            document.getElementById('subtotalDisplay').innerText = subtotal;
            let shipping = 0; // Free or flat rate logic if needed
            let total = subtotal + shipping;
            document.getElementById('totalDisplay').innerText = total;

            // Update Free Shipping Banner
            let difference = freeShippingThreshold - subtotal;
            if (difference > 0) {
                shippingBanner.innerHTML = `🎉 You are <span>₹${difference}</span> away from <br> <strong>FREE SHIPPING</strong>`;
                shippingBanner.style.backgroundColor = '#f8f8f8';
                shippingBanner.style.borderColor = '#cccccc';
            } else {
                shippingBanner.innerHTML = `✨ Congratulations! You get <br> <strong>FREE SHIPPING</strong>`;
                shippingBanner.style.backgroundColor = '#e8f5e9';
                shippingBanner.style.borderColor = '#4caf50';
            }
        }

        function changeQty(index, change) {
            let cart = JSON.parse(localStorage.getItem('heavySoulCart')) || [];
            cart[index].quantity += change;
            
            if (cart[index].quantity < 1) {
                cart[index].quantity = 1;
            }

            localStorage.setItem('heavySoulCart', JSON.stringify(cart));
            loadCart();
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('heavySoulCart')) || [];
            if (confirm("Are you sure you want to remove this item?")) {
                cart.splice(index, 1);
                localStorage.setItem('heavySoulCart', JSON.stringify(cart));
                loadCart();
            }
        }

        window.onload = loadCart;
    </script>
<script src="js/config.js"></script><script src="https://checkout.razorpay.com/v1/checkout.js"></script><script src="js/commerce.js"></script></body>
</html>
