<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | Heavy Soul</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS Reset & Global Styles */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Helvetica Neue', Arial, sans-serif; }
        body { background-color: #ffffff; color: #000000; padding-bottom: 70px; }
        
        /* Top Navigation */
        .top-nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 1px solid #eeeeee; background: #ffffff; position: sticky; top: 0; z-index: 100; }
        .top-nav .menu-icon, .top-nav .nav-icons i { font-size: 1.2rem; cursor: pointer; color: #000; }
        .top-nav .logo { font-weight: 900; font-size: 1.4rem; letter-spacing: 1px; text-transform: uppercase; }
        .top-nav .nav-icons { display: flex; gap: 15px; }

        /* Page Title */
        .page-title { text-align: left; padding: 20px 20px 10px; }
        .page-title h1 { font-size: 1.3rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px;}

        /* Filter & Sort Section */
        .filter-sort-container { display: flex; gap: 10px; padding: 10px 20px 20px; border-bottom: 1px solid #eeeeee; }
        .action-btn { flex: 1; padding: 10px; background-color: #ffffff; border: 1px solid #dddddd; color: #000000; font-weight: 700; font-size: 0.8rem; text-transform: uppercase; cursor: pointer; border-radius: 2px; display: flex; justify-content: center; align-items: center; gap: 8px; }
        
        /* Product Grid */
        .shop-grid { padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .product-card { text-decoration: none; color: inherit; cursor: pointer; }
        .product-card .image-placeholder { width: 100%; aspect-ratio: 4/5; background-color: #000000; display: flex; justify-content: center; align-items: center; margin-bottom: 10px; border-radius: 4px; overflow: hidden; position: relative; }
        .product-card img { width: 100%; height: 100%; object-fit: cover; }
        .product-title { font-weight: 700; font-size: 0.9rem; margin-bottom: 4px; }
        .product-price { font-weight: 600; font-size: 0.9rem; color: #333333; }

        /* Bottom Navigation (Sticky) */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #ffffff; border-top: 1px solid #eeeeee; display: flex; justify-content: space-around; padding: 12px 0; z-index: 1000; }
        .nav-item { text-align: center; color: #999999; text-decoration: none; font-size: 0.65rem; display: flex; flex-direction: column; align-items: center; gap: 5px; font-weight: 600; }
        .nav-item.active { color: #000000; } /* Highlight Shop icon */
        .nav-item i { font-size: 1.2rem; }
    </style>
</head>
<body>

    <!-- Top Navigation -->
    <nav class="top-nav">
        <i class="fa-solid fa-bars menu-icon"></i>
        <div class="logo">HEAVY SOUL</div>
        <div class="nav-icons">
            <i class="fa-solid fa-magnifying-glass"></i>
            <i class="fa-regular fa-bell"></i>
        </div>
    </nav>

    <!-- Page Title -->
    <div class="page-title">
        <h1>Shop All</h1>
    </div>

    <!-- Filter & Sort Buttons -->
    <div class="filter-sort-container">
        <button class="action-btn">
            <i class="fa-solid fa-sliders"></i> Filter
        </button>
        <button class="action-btn">
            <i class="fa-solid fa-arrow-down-a-z"></i> Sort
        </button>
    </div>

    <!-- Product Grid -->
    <section class="shop-grid" id="shopContainer">
        <!-- Products will be injected here by JS -->
    </section>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="shop.html" class="nav-item active"> <!-- Active Class added here -->
            <i class="fa-solid fa-bag-shopping"></i>
            <span>Shop</span>
        </a>
        <a href="wishlist.html" class="nav-item">
            <i class="fa-regular fa-heart"></i>
            <span>Wishlist</span>
        </a>
        <a href="account.html" class="nav-item">
            <i class="fa-regular fa-user"></i>
            <span>Account</span>
        </a>
        <a href="cart.html" class="nav-item">
            <i class="fa-solid fa-cart-shopping"></i>
            <span>Cart</span>
        </a>
    </nav>

    <!-- Real site config + live product catalog (Apps Script + fallback) -->
    <script src="js/config.js"></script>
    <script src="js/products.js"></script>

    <!-- JavaScript for Product Loading (now using real PRODUCTS data) -->
    <script>
        function shopCardHTML(p) {
            const price = p.compareAt
                ? `<span style="text-decoration:line-through;color:#999;margin-right:6px;">₹${p.compareAt}</span>₹${p.price}`
                : `₹${p.price}`;
            return `
                <a class="product-card" href="product.html?id=${p.id}">
                    <div class="image-placeholder">
                        <img src="${escapeHtml(p.image)}" alt="${escapeHtml(p.name)}">
                    </div>
                    <div class="product-title">${escapeHtml(p.name)}</div>
                    <div class="product-price">${price}</div>
                </a>
            `;
        }

        function loadShopProducts() {
            const container = document.getElementById('shopContainer');
            container.innerHTML = PRODUCTS.map(shopCardHTML).join('') ||
                '<p style="grid-column:1/-1;color:#999;">No products yet.</p>';
        }

        loadShopProducts();
        // Re-render once the live catalog (from Apps Script) finishes loading.
        window.addEventListener("hs:productsUpdated", loadShopProducts);
    </script>
</body>
</html>
