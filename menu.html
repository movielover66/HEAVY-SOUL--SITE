<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu | Heavy Soul</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS Reset & Global Styles */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Helvetica Neue', Arial, sans-serif; }
        body { background-color: #ffffff; color: #000000; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        
        /* 1. Top Bar */
        .menu-top { display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 1px solid #eeeeee; }
        .menu-top .logo { font-weight: 900; font-size: 1.3rem; letter-spacing: 1px; text-transform: uppercase; }
        .close-btn { font-size: 1.4rem; cursor: pointer; color: #000000; }

        /* 2. Menu Links Container */
        .menu-links { padding: 20px; display: flex; flex-direction: column; gap: 5px; }
        .menu-link-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #f2f2f2; text-decoration: none; color: #000000; font-size: 1.1rem; font-weight: 800; text-transform: uppercase; transition: 0.2s; }
        .menu-link-item:hover { color: #555555; padding-left: 5px; }
        .menu-link-item i { font-size: 0.9rem; color: #cccccc; }

        /* 3. Footer Info inside Menu */
        .menu-footer { padding: 20px; background-color: #f9f9f9; border-top: 1px solid #eeeeee; text-align: center; }
        .social-icons { display: flex; justify-content: center; gap: 20px; margin-bottom: 15px; }
        .social-icons a { width: 40px; height: 40px; background-color: #000000; color: #ffffff; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.1rem; text-decoration: none; }
        .brand-slogan { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; color: #666666; letter-spacing: 1px; }
    </style>
</head>
<body>

    <!-- Top Bar with Close Button -->
    <div class="menu-top">
        <div class="logo">HEAVY SOUL</div>
        <i class="fa-solid fa-xmark close-btn" onclick="window.history.back()"></i>
    </div>

    <!-- Navigation Links -->
    <div class="menu-links">
        <a href="index.html" class="menu-link-item">
            <span>Home</span>
            <i class="fa-solid fa-chevron-right"></i>
        </a>
        <a href="shop.html" class="menu-link-item">
            <span>Shop Collection</span>
            <i class="fa-solid fa-chevron-right"></i>
        </a>
        <a href="size-guide.html" class="menu-link-item">
            <span>Size Guide</span>
            <i class="fa-solid fa-chevron-right"></i>
        </a>
        <a href="order-tracking.html" class="menu-link-item">
            <span>Track Order</span>
            <i class="fa-solid fa-chevron-right"></i>
        </a>
        <a href="wishlist.html" class="menu-link-item">
            <span>Wishlist</span>
            <i class="fa-solid fa-chevron-right"></i>
        </a>
        <a href="account.html" class="menu-link-item">
            <span>My Account</span>
            <i class="fa-solid fa-chevron-right"></i>
        </a>
        <a href="about.html" class="menu-link-item">
            <span>About Us</span>
            <i class="fa-solid fa-chevron-right"></i>
        </a>
        <a href="policy.html" class="menu-link-item">
            <span>Store Policy</span>
            <i class="fa-solid fa-chevron-right"></i>
        </a>
        <a href="cancellation.html" class="menu-link-item">
            <span>Cancellation Policy</span>
            <i class="fa-solid fa-chevron-right"></i>
        </a>
        <a href="https://wa.me/919339909978" target="_blank" class="menu-link-item" style="color: #25D366;">
            <span>WhatsApp Support</span>
            <i class="fa-solid fa-chevron-right"></i>
        </a>
    </div>

    <!-- Menu Footer / Socials -->
    <div class="menu-footer">
        <div class="social-icons">
            <a href="https://instagram.com/heavy_soul_india" target="_blank"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://wa.me/919339909978" target="_blank"><i class="fa-brands fa-whatsapp"></i></a>
        </div>
        <div class="brand-slogan">Oversized. Bold. Fearless.</div>
    </div>

</body>
</html>
