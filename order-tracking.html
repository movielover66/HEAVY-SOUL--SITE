<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Your Order | Heavy Soul</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS Reset & Global Styles */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Helvetica Neue', Arial, sans-serif; }
        body { background-color: #ffffff; color: #000000; padding-bottom: 20px; }
        
        /* 1. Top Navigation */
        .top-nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 1px solid #eeeeee; position: sticky; top: 0; background: #ffffff; z-index: 100; }
        .top-nav i { font-size: 1.2rem; cursor: pointer; color: #000; }
        .top-nav .logo { font-weight: 900; font-size: 1.3rem; letter-spacing: 1px; text-transform: uppercase; }

        /* 2. Page Title & Input Section */
        .page-header { text-align: center; padding: 25px 20px 15px; }
        .page-header h1 { font-size: 1.1rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 20px; }
        
        .tracking-form { display: flex; gap: 10px; padding: 0 20px; margin-bottom: 30px; }
        .input-group { flex-grow: 1; display: flex; flex-direction: column; }
        .input-group label { font-size: 0.75rem; font-weight: 700; margin-bottom: 5px; color: #555; }
        .input-group input { padding: 12px 15px; border: 1px solid #cccccc; border-radius: 3px; font-size: 0.95rem; font-weight: 700; outline: none; }
        .input-group input:focus { border-color: #000000; }
        
        .btn-track { padding: 0 25px; background-color: #000000; color: #ffffff; font-weight: 900; font-size: 0.85rem; text-transform: uppercase; border: none; border-radius: 3px; cursor: pointer; margin-top: 19px; /* aligns with input */ }

        /* 3. Tracking Timeline */
        .timeline-container { padding: 0 30px; margin-bottom: 40px; }
        .timeline { position: relative; border-left: 2px solid #4CAF50; padding-left: 25px; margin-left: 15px; }
        /* Grey line for incomplete steps */
        .timeline::before { content: ''; position: absolute; left: -2px; top: 70%; bottom: 0; width: 2px; background-color: #eeeeee; }
        
        .timeline-step { position: relative; margin-bottom: 30px; }
        .timeline-step:last-child { margin-bottom: 0; }
        
        /* Timeline Icons */
        .step-icon { position: absolute; left: -42px; top: -2px; width: 32px; height: 32px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 0.85rem; background-color: #ffffff; border: 2px solid #4CAF50; color: #4CAF50; z-index: 2; }
        .timeline-step.completed .step-icon { background-color: #4CAF50; color: #ffffff; }
        .timeline-step.pending .step-icon { border-color: #dddddd; color: #dddddd; }
        
        /* Timeline Text */
        .step-content { padding-top: 2px; }
        .step-title { font-weight: 800; font-size: 0.95rem; margin-bottom: 4px; color: #000000; }
        .step-date { font-size: 0.75rem; color: #666666; font-weight: 600; line-height: 1.4; }
        
        .timeline-step.pending .step-title { color: #999999; }
        .timeline-step.pending .step-date { display: none; }

        /* 4. WhatsApp Support Banner */
        .whatsapp-support { margin: 0 20px; border: 1px solid #eeeeee; border-radius: 6px; padding: 15px; display: flex; align-items: center; gap: 15px; background: #ffffff; box-shadow: 0 4px 15px rgba(0,0,0,0.03); cursor: pointer; text-decoration: none; color: inherit; }
        .whatsapp-icon { width: 45px; height: 45px; background-color: #e8f5e9; color: #25D366; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.6rem; flex-shrink: 0; }
        .whatsapp-text { flex-grow: 1; }
        .whatsapp-title { font-weight: 800; font-size: 0.95rem; margin-bottom: 3px; }
        .whatsapp-subtitle { font-size: 0.8rem; color: #555555; font-weight: 600; }
        .whatsapp-arrow { color: #999999; font-size: 1.1rem; }

    </style>
</head>
<body>

    <!-- Top Navigation -->
    <nav class="top-nav">
        <i class="fa-solid fa-bars"></i>
        <div class="logo">HEAVY SOUL</div>
        <i class="fa-solid fa-bag-shopping"></i>
    </nav>

    <!-- Page Header & Input -->
    <div class="page-header">
        <h1>Track Your Order</h1>
    </div>

    <form class="tracking-form" onsubmit="event.preventDefault(); alert('Tracking info updated!');">
        <div class="input-group">
            <label>Order ID</label>
            <input type="text" value="HS123456" placeholder="Enter Order ID">
        </div>
        <button type="submit" class="btn-track">TRACK</button>
    </form>

    <!-- Order Timeline -->
    <div class="timeline-container">
        <div class="timeline">
            
            <!-- Step 1: Confirmed -->
            <div class="timeline-step completed">
                <div class="step-icon"><i class="fa-solid fa-clipboard-check"></i></div>
                <div class="step-content">
                    <div class="step-title">Order Confirmed</div>
                    <div class="step-date">May 20, 2026<br>10:30 AM</div>
                </div>
            </div>

            <!-- Step 2: Processing -->
            <div class="timeline-step completed">
                <div class="step-icon"><i class="fa-solid fa-gear"></i></div>
                <div class="step-content">
                    <div class="step-title">Order Processing</div>
                    <div class="step-date">May 20, 2026<br>02:15 PM</div>
                </div>
            </div>

            <!-- Step 3: Shipped -->
            <div class="timeline-step completed">
                <div class="step-icon"><i class="fa-solid fa-truck-fast"></i></div>
                <div class="step-content">
                    <div class="step-title">Order Shipped</div>
                    <div class="step-date">May 21, 2026<br>11:45 AM</div>
                </div>
            </div>

            <!-- Step 4: Out for Delivery (Pending) -->
            <div class="timeline-step pending">
                <div class="step-icon"><i class="fa-solid fa-box-open"></i></div>
                <div class="step-content">
                    <div class="step-title">Out for Delivery</div>
                    <div class="step-date">--</div>
                </div>
            </div>

            <!-- Step 5: Delivered (Pending) -->
            <div class="timeline-step pending">
                <div class="step-icon"><i class="fa-solid fa-check"></i></div>
                <div class="step-content">
                    <div class="step-title">Delivered</div>
                    <div class="step-date">--</div>
                </div>
            </div>

        </div>
    </div>

    <!-- WhatsApp Support -->
    <a href="https://wa.me/919339909978" target="_blank" class="whatsapp-support">
        <div class="whatsapp-icon">
            <i class="fa-brands fa-whatsapp"></i>
        </div>
        <div class="whatsapp-text">
            <div class="whatsapp-title">NEED HELP?</div>
            <div class="whatsapp-subtitle">Chat with us on WhatsApp</div>
        </div>
        <i class="fa-solid fa-arrow-right whatsapp-arrow"></i>
    </a>

<script src="js/config.js"></script><script src="https://checkout.razorpay.com/v1/checkout.js"></script><script src="js/commerce.js"></script></body>
</html>
